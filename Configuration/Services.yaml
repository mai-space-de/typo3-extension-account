services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Maispace\MaiAccount\:
    resource: '../Classes/*'

  # --- Controllers (must be public for Extbase) ---

  Maispace\MaiAccount\Controller\LoginController:
    public: true
    tags:
      - name: 'controller.argument_value_resolver'

  Maispace\MaiAccount\Controller\RegistrationController:
    public: true

  Maispace\MaiAccount\Controller\MfaController:
    public: true

  Maispace\MaiAccount\Controller\ProfileController:
    public: true

  # --- Repositories ---

  Maispace\MaiAccount\Domain\Repository\FrontendUserRepository:
    public: true

  # --- Services ---

  Maispace\MaiAccount\Service\RegistrationService:
    public: true

  Maispace\MaiAccount\Service\MfaService:
    public: true

  Maispace\MaiAccount\Service\ProfileService:
    public: true

  # --- Scheduler Task ---

  Maispace\MaiAccount\Task\SendRemindersTask:
    public: true

  # --- PSR-14 Event Listeners ---

  Maispace\MaiAccount\Service\ReminderService:
    public: true
    tags:
      - name: 'event.listener'
        identifier: 'maispace/account/reminder-on-event-registered'
        event: 'Maispace\MaiAccount\Event\EventRegisteredEvent'
        method: 'onEventRegistered'
