<f:layout name="Default" />

<f:section name="Main">
    <div class="tx-account-password-reset">
        <h1>Passwort zurücksetzen</h1>

        <f:if condition="{resetRequested}">
            <f:then>
                <div class="alert alert-success" role="alert">
                    Falls ein Konto mit dieser E-Mail-Adresse existiert, haben wir Ihnen einen Reset-Link gesendet.
                    Bitte prüfen Sie Ihr Postfach.
                </div>
                <p>
                    <f:link.action action="index" controller="Login" pluginName="Login" extensionName="account">
                        Zurück zur Anmeldung
                    </f:link.action>
                </p>
            </f:then>
            <f:else>
                <p>Bitte geben Sie Ihre E-Mail-Adresse ein. Wir senden Ihnen einen Link zum Zurücksetzen Ihres Passworts.</p>

                <f:form action="passwordReset" controller="Login" pluginName="Login" extensionName="account" method="post">
                    <div class="form-group">
                        <label for="tx-account-reset-email">E-Mail-Adresse</label>
                        <f:form.textfield
                            name="tx_maiaccount_login[email]"
                            id="tx-account-reset-email"
                            class="form-control"
                            type="email"
                            required="required"
                            placeholder="ihre@email.de"
                        />
                    </div>

                    <div class="mt-3">
                        <f:form.submit value="Reset-Link anfordern" class="btn btn-primary" />
                    </div>
                </f:form>

                <p class="mt-3">
                    <f:link.action action="index" controller="Login" pluginName="Login" extensionName="account">
                        Zurück zur Anmeldung
                    </f:link.action>
                </p>
            </f:else>
        </f:if>
    </div>
</f:section>
