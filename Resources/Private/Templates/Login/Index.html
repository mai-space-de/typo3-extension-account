<f:layout name="Default" />

<f:section name="Main">
    <div class="tx-account-login">
        <h1>Anmelden</h1>

        <f:if condition="{loginError}">
            <div class="alert alert-danger" role="alert">
                Ungültige Anmeldedaten. Bitte versuchen Sie es erneut.
            </div>
        </f:if>

        <f:form action="login" controller="Login" pluginName="Login" extensionName="account" method="post">
            <f:form.hidden name="logintype" value="login" />
            <f:form.hidden name="pid" value="{settings.storagePid}" />
            <f:form.hidden name="redirect_url" value="" />

            <div class="form-group">
                <label for="tx-account-username">E-Mail-Adresse</label>
                <f:form.textfield
                    name="user"
                    id="tx-account-username"
                    class="form-control"
                    type="email"
                    required="required"
                    autocomplete="username"
                    placeholder="ihre@email.de"
                />
            </div>

            <div class="form-group mt-3">
                <label for="tx-account-password">Passwort</label>
                <f:form.password
                    name="pass"
                    id="tx-account-password"
                    class="form-control"
                    required="required"
                    autocomplete="current-password"
                    placeholder="Passwort"
                />
            </div>

            <div class="mt-4 d-flex justify-content-between align-items-center">
                <f:form.submit value="Anmelden" class="btn btn-primary" />
                <f:link.action action="passwordReset" controller="Login" pluginName="Login" extensionName="account">
                    Passwort vergessen?
                </f:link.action>
            </div>
        </f:form>

        <hr />
        <p>
            Noch kein Konto?
            <f:link.action action="index" controller="Registration" pluginName="Registration" extensionName="account">
                Jetzt registrieren
            </f:link.action>
        </p>
    </div>
</f:section>
