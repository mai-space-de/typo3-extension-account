<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="Content">
    <div class="tx-account-login">
        <h2>Anmelden</h2>
        <f:if condition="{isLoggedIn}">
            <f:then>
                <p>Du bist bereits angemeldet.</p>
            </f:then>
            <f:else>
                <f:form action="login" method="post">
                    <div class="form-group">
                        <label for="username">Benutzername</label>
                        <f:form.textfield id="username" name="username" class="form-control" required="required" />
                    </div>
                    <div class="form-group">
                        <label for="password">Passwort</label>
                        <f:form.password id="password" name="password" class="form-control" required="required" />
                    </div>
                    <button type="submit" class="btn btn-primary">Anmelden</button>
                </f:form>
            </f:else>
        </f:if>
    </div>
</f:section>
</html>
