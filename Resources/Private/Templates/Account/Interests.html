<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:layout name="Default"/>
<f:section name="main">
    <div class="mai-account-interests">
        <h2><f:translate key="account.interests" extensionName="mai_account"/></h2>
        <f:flashMessages/>
        <f:form.validationResults>
            <f:if condition="{validationResults.flattenedErrors}">
                <div class="mai-account-interests__errors" role="alert">
                    <f:for each="{validationResults.flattenedErrors}" as="errors" key="propertyName">
                        <f:for each="{errors}" as="error">
                            <p class="mai-account-interests__error">{error.message}</p>
                        </f:for>
                    </f:for>
                </div>
            </f:if>
        </f:form.validationResults>
        <f:form action="interests" method="post" class="form">
            <div class="mai-account-interests__list">
                <f:for each="{allInterests}" as="interest">
                    <div class="form-inline mai-account-interests__item">
                        <div class="form-field">
                            <f:form.checkbox
                                name="selectedInterests[]"
                                value="{interest.uid}"
                                checked="{interest.uid -> f:if(condition: '{user.txMaiaccountInterests -> f:count()} > 0', then: true, else: false)}"
                                id="interest_{interest.uid}"
                            />
                            <label for="interest_{interest.uid}">{interest.title}</label>
                        </div>
                    </div>
                </f:for>
            </div>
            <div class="form-actions">
                <f:form.submit value="{f:translate(key: 'profile.save', extensionName: 'mai_account', default: 'Save')}" class="button"/>
            </div>
        </f:form>
        <f:link.action action="profile"><f:translate key="account.profile" extensionName="mai_account"/></f:link.action>
    </div>
</f:section>
</html>
