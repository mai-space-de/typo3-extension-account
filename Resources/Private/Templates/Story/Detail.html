<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:layout name="Default"/>
<f:section name="main">
    <div class="mai-story-detail">
        <f:flashMessages/>
        <f:form.validationResults>
            <f:if condition="{validationResults.flattenedErrors}">
                <div class="mai-story-detail__errors" role="alert">
                    <f:for each="{validationResults.flattenedErrors}" as="errors" key="propertyName">
                        <f:for each="{errors}" as="error">
                            <p class="mai-story-detail__error">{error.message}</p>
                        </f:for>
                    </f:for>
                </div>
            </f:if>
        </f:form.validationResults>
        <f:if condition="{story}">
            <f:then>
                <article class="mai-story-detail__article">
                    <header class="mai-story-detail__header">
                        <h1 class="mai-story-detail__title">{story.title}</h1>
                        <f:if condition="{story.publishedAt}">
                            <time class="mai-story-detail__date" datetime="{f:format.date(date: story.publishedAt, format: 'c')}">
                                <f:format.date date="{story.publishedAt}" format="{settings.dateFormat}"/>
                            </time>
                        </f:if>
                    </header>
                    <f:if condition="{story.media}">
                        <div class="mai-story-detail__media">
                            <f:for each="{story.media}" as="file">
                                <f:image image="{file}" alt="{story.title}" class="mai-story-detail__image"/>
                            </f:for>
                        </div>
                    </f:if>
                    <div class="mai-story-detail__content">
                        <f:render.text record="{story}" field="content" />
                    </div>
                </article>
            </f:then>
            <f:else>
                <p><f:translate key="story.notFound" extensionName="mai_account" default="Story not found."/></p>
            </f:else>
        </f:if>
        <div class="mai-story-detail__back">
            <f:link.action action="list"><f:translate key="story.list" extensionName="mai_account"/></f:link.action>
        </div>
    </div>
</f:section>
</html>
