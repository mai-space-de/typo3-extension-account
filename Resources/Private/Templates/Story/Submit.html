<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:layout name="Default"/>
<f:section name="main">
    <div class="mai-story-submit">
        <h2><f:translate key="story.submit" extensionName="mai_account"/></h2>
        <f:flashMessages/>
        <f:form.validationResults>
            <f:if condition="{validationResults.flattenedErrors}">
                <div class="mai-story-submit__errors" role="alert">
                    <f:for each="{validationResults.flattenedErrors}" as="errors" key="propertyName">
                        <f:for each="{errors}" as="error">
                            <p class="mai-story-submit__error">{error.message}</p>
                        </f:for>
                    </f:for>
                </div>
            </f:if>
        </f:form.validationResults>
        <f:form action="submit" method="post" enctype="multipart/form-data" class="form">
            <div class="form-field">
                <label for="storyTitle"><f:translate key="story.field.title" extensionName="mai_account" default="Title"/></label>
                <f:form.textfield id="storyTitle" name="title" required="true"/>
            </div>
            <div class="form-field">
                <label for="storyContent"><f:translate key="story.field.content" extensionName="mai_account" default="Your Story"/></label>
                <f:form.textarea id="storyContent" name="content" rows="10" required="true"/>
            </div>
            <div class="form-field">
                <label for="storyMedia"><f:translate key="story.field.media" extensionName="mai_account" default="Images (optional)"/></label>
                <f:form.upload id="storyMedia" name="media" multiple="multiple" accept="image/*"/>
            </div>
            <div class="form-actions">
                <f:form.submit value="{f:translate(key: 'story.submit', extensionName: 'mai_account')}" class="button"/>
                <f:link.action action="list" class="button button-outline"><f:translate key="action.cancel" extensionName="mai_account" default="Cancel"/></f:link.action>
            </div>
        </f:form>
    </div>
</f:section>
</html>
