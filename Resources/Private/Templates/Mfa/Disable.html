<f:layout name="Default" />

<f:section name="Main">
    <div class="tx-account-mfa-disable">
        <h1>Zwei-Faktor-Authentifizierung deaktivieren</h1>

        <f:if condition="{disabled}">
            <f:then>
                <div class="alert alert-success" role="alert">
                    Die Zwei-Faktor-Authentifizierung wurde deaktiviert. Ihr Konto ist nun nur noch durch Ihr Passwort geschützt.
                </div>
                <p>
                    <f:link.action action="dashboard" controller="Profile" pluginName="Profile" extensionName="account">
                        Zum Profil-Dashboard
                    </f:link.action>
                </p>
            </f:then>
            <f:else>
                <div class="alert alert-danger" role="alert">
                    <strong>Achtung:</strong> Das Deaktivieren der Zwei-Faktor-Authentifizierung verringert die Sicherheit Ihres Kontos.
                </div>

                <f:form action="disable" controller="Mfa" pluginName="Mfa" extensionName="account" method="post">
                    <f:form.submit value="MFA wirklich deaktivieren" class="btn btn-danger" />
                    <f:link.action action="dashboard" controller="Profile" pluginName="Profile" extensionName="account" class="btn btn-secondary ms-2">
                        Abbrechen
                    </f:link.action>
                </f:form>
            </f:else>
        </f:if>
    </div>
</f:section>
