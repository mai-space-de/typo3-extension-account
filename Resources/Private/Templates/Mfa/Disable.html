<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:layout name="Default"/>
<f:section name="main">
    <div class="mai-mfa-disable">
        <h2><f:translate key="mfa.disable" extensionName="mai_account"/></h2>
        <f:flashMessages/>
        <p><f:translate key="mfa.disable.warning" extensionName="mai_account" default="Are you sure you want to disable two-factor authentication? This will make your account less secure."/></p>
        <f:form.validationResults>
            <f:if condition="{validationResults.flattenedErrors}">
                <div class="mai-mfa-disable__errors" role="alert">
                    <f:for each="{validationResults.flattenedErrors}" as="errors" key="propertyName">
                        <f:for each="{errors}" as="error">
                            <p class="mai-mfa-disable__error">{error.message}</p>
                        </f:for>
                    </f:for>
                </div>
            </f:if>
        </f:form.validationResults>
        <f:form action="disable" controller="Mfa" method="post" class="form">
            <div class="form-field">
                <label for="code"><f:translate key="mfa.code" extensionName="mai_account" default="Authentication Code"/></label>
                <f:form.textfield id="code" name="code" required="true" autocomplete="one-time-code" inputmode="numeric" maxlength="6"/>
            </div>
            <div class="form-actions">
                <f:form.submit value="{f:translate(key: 'mfa.disable', extensionName: 'mai_account')}" class="button"/>
                <f:link.action action="profile" controller="Account" class="button button-outline"><f:translate key="action.cancel" extensionName="mai_account" default="Cancel"/></f:link.action>
            </div>
        </f:form>
    </div>
</f:section>
</html>
