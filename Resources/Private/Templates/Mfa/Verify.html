<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="Content">
    <div class="tx-account-mfa-verify">
        <h2>Zwei-Faktor-Authentifizierung</h2>
        <f:if condition="{valid}">
            <f:then>
                <div class="alert alert-success">Erfolgreich verifiziert.</div>
            </f:then>
            <f:else>
                <f:form action="verify" method="post">
                    <div class="form-group">
                        <label for="code">Authentifizierungscode</label>
                        <f:form.textfield id="code" name="code" class="form-control" required="required" autocomplete="one-time-code" />
                    </div>
                    <button type="submit" class="btn btn-primary">Verifizieren</button>
                </f:form>
            </f:else>
        </f:if>
    </div>
</f:section>
</html>
