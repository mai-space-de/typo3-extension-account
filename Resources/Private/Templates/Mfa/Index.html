<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="Content">
    <div class="tx-account-mfa">
        <h2>Zwei-Faktor-Authentifizierung</h2>
        <f:if condition="{user.mfaEnabled}">
            <f:then>
                <p class="alert alert-success">MFA ist aktiv.</p>
                <f:form action="disable" method="post">
                    <button type="submit" class="btn btn-danger">MFA deaktivieren</button>
                </f:form>
            </f:then>
            <f:else>
                <p>MFA ist nicht aktiv.</p>
                <f:link.action action="setup" class="btn btn-primary">MFA einrichten</f:link.action>
            </f:else>
        </f:if>
    </div>
</f:section>
</html>
